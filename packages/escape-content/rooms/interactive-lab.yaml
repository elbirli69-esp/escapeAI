id: interactive-lab
name: Laboratorio sensorial
tagline: Sonido, voz, cámara e imágenes — prueba todas las pistas.
theme: urban
coverImage: /media/pilot-cover.jpg
timeLimitSec: 1800
startSceneId: hub
winCondition:
  type: puzzle_solved
  puzzleId: voice_finale
items: {}
scenes:
  hub:
    id: hub
    title: Hub de pruebas
    image: /media/pilot-entrance.jpg
    mood: Luces LED y altavoces ocultos en la pared.
    description: >
      Cuatro estaciones esperan: una emite un código en Morse (simplificado a dígitos
      hablados), otra exige tu voz, otra la cámara y la última una imagen enigma.
    puzzles: [sound_station, visual_station, camera_station, voice_finale]
    exits: []
puzzles:
  sound_station:
    id: sound_station
    type: sound
    label: Estación sonora
    prompt: Pulsa reproducir y escucha el patrón de tonos (2 pips = 2, pausa larga = separador). Respuesta de una cifra.
    soundMode: beeps
    beepPattern: [120, 80, 120, 80, 120, 300, 360, 80, 360, 80, 360]
    minListenSec: 2
    answer: "3"
    normalize: trim
    maxHints: 2
    hints:
      - level: 1
        text: Las cifras se anuncian en voz alta al acabar el efecto.
      - level: 2
        text: Prueba 4268 (solo en demo; cambia en tu sala generada).
  visual_station:
    id: visual_station
    type: visual
    label: Enigma visual
    visualLayout: dual
    prompt: Desliza el separador entre imágenes. ¿Cuántas puertas rojas en la de la izquierda? (número)
    pexelsQuery: red doors building
    pexelsQueryB: red brick wall doors
    answer: "3"
    normalize: trim
    maxHints: 1
    hints:
      - level: 1
        text: Cuenta solo las puertas claramente rojas; en el fallback local imagina tres.
  camera_station:
    id: camera_station
    type: camera
    label: Lectura con OCR
    cameraMode: ocr_hint
    ocrLang: spa+eng
    cameraPrompt: Fotografía un texto impreso (etiqueta, libro, pantalla). El OCR solo da pista en tu móvil.
    prompt: Escribe la primera cifra que veas (en demo, 7 si no hay texto claro).
    answer: "7"
    normalize: trim
    maxHints: 1
    hints:
      - level: 1
        text: El OCR es solo ayuda; en demo puedes escribir 7 directamente.
  voice_finale:
    id: voice_finale
    type: voice
    label: Sello de voz
    prompt: Di en voz alta la frase mágica para cerrar el laboratorio.
    answer: "luego"
    normalize: lowercase
    voiceMatchMode: fuzzy
    allowTextFallback: true
    voiceOffline: true
    voiceLocale: es-ES
    maxHints: 1
    hints:
      - level: 1
        text: La frase es «luego» (como «hasta luego» sin el hasta).
