id: interactive-lab
name: Laboratorio sensorial
tagline: Sonido, voz, cámara e imágenes — recorre las tres cámaras del laboratorio.
theme: urban
coverImage: /media/pilot-basement.jpg
timeLimitSec: 1800
startSceneId: sensory_hub
winCondition:
  type: puzzle_solved
  puzzleId: voice_finale
beats:
  - id: lab_open
    after: session_started
    text: "Tres cámaras parpadean: oído y vista primero; la cámara y la voz sellan el circuito."
  - id: lab_sound
    after: puzzle_solved
    puzzleId: sound_station
    text: "El morse quedó grabado; gira el dial hacia el enigma visual."
  - id: lab_visual
    after: puzzle_solved
    puzzleId: visual_station
    text: "Puertas contadas; el pasillo de ópticas pide tres lecturas con la cámara."
  - id: lab_camera_bay
    after: scene_entered
    sceneId: camera_bay
    text: "Lentes humean: OCR, objeto vivo y sillas en fila — la sala marca SENSOR."
  - id: lab_sigil
    after: puzzle_solved
    puzzleId: sigil_lock
    text: "El panel verde acepta la palabra; una voz debe pronunciar el cierre."
  - id: lab_voice_chamber
    after: scene_entered
    sceneId: voice_chamber
    text: "Aislamiento acústico. Solo la frase correcta apaga las luces del laboratorio."
items: {}
scenes:
  sensory_hub:
    id: sensory_hub
    title: Cubículo oído y vista
    image: /media/pilot-control.jpg
    mood: Luces LED y altavoces ocultos en la pared.
    description: >
      La primera cámara combina audición y comparación visual. Demuestra que el
      hardware capta señales antes de avanzar al carril de cámaras reales.
    puzzles: [sound_station, visual_station]
    exits:
      - toSceneId: camera_bay
        label: Abrir el pasillo de ópticas
        when:
          type: puzzle_solved
          puzzleId: visual_station
  camera_bay:
    id: camera_bay
    title: Pasillo de ópticas
    image: /media/pilot-basement.jpg
    mood: Cables colgando, tres cabinas con un letrero SENSOR en el suelo.
    description: >
      Tres estaciones: texto con OCR, detección de objeto y conteo de sillas.
      Cuando las tres cedan, el panel de acceso al aislamiento acústico se enciende.
    puzzles: [camera_station, camera_object_lab, camera_count_lab]
    exits:
      - toSceneId: voice_chamber
        label: Ir al aislamiento acústico
        when:
          type: puzzle_solved
          puzzleId: camera_station
  voice_chamber:
    id: voice_chamber
    title: Aislamiento acústico
    image: /media/pilot-cover.jpg
    mood: Espuma en las paredes; un micrófono rojo espera la frase de cierre.
    description: >
      Primero valida la palabra clave del panel verde (siete letras), luego
      pronuncia la frase mágica que apaga el laboratorio.
    puzzles: [sigil_lock, voice_finale]
    exits: []
puzzles:
  sound_station:
    id: sound_station
    type: sound
    label: Estación sonora
    cardImage: /media/pilot-control.jpg
    prompt: Pulsa reproducir y escucha el patrón de tonos (2 pips = 2, pausa larga = separador). Respuesta de una cifra.
    soundMode: beeps
    beepPattern: [120, 80, 120, 80, 120, 300, 360, 80, 360, 80, 360]
    minListenSec: 2
    answer: "3"
    normalize: trim
    maxHints: 2
    hints:
      - level: 1
        text: Las cifras se anuncian en voz alta al acabar el efecto.
      - level: 2
        text: La respuesta es una sola cifra, 3.
  visual_station:
    id: visual_station
    type: visual
    label: Enigma visual
    cardImage: /media/pilot-entrance.jpg
    visualLayout: dual
    prompt: Desliza el separador entre imágenes. ¿Cuántas puertas rojas en la de la izquierda? (número)
    pexelsQuery: red doors building
    pexelsQueryB: red brick wall doors
    answer: "3"
    normalize: trim
    maxHints: 1
    hints:
      - level: 1
        text: Cuenta solo las puertas claramente rojas; en el fallback local imagina tres.
  camera_station:
    id: camera_station
    type: camera
    label: Lectura con OCR
    cardImage: /media/pilot-basement.jpg
    cameraMode: ocr_hint
    ocrLang: spa+eng
    cameraPrompt: Fotografía un texto impreso (etiqueta, libro, pantalla). El OCR solo da pista en tu móvil.
    prompt: Escribe la primera cifra que veas (en demo, 7 si no hay texto claro).
    answer: "7"
    normalize: trim
    maxHints: 1
    hints:
      - level: 1
        text: El OCR es solo ayuda; en demo puedes escribir 7 directamente.
  camera_object_lab:
    id: camera_object_lab
    type: camera
    label: Objeto en la sala
    cardImage: /media/pilot-basement.jpg
    cameraMode: keyword
    cameraExpectedCategory: plant
    allowCameraManualConfirm: true
    cameraPrompt: Fotografía una planta (real o de prueba). La detección es solo pista local.
    prompt: Escribe PLANTA para continuar en demo (la sala valida en servidor).
    answer: PLANTA
    normalize: uppercase
    maxHints: 1
    hints:
      - level: 1
        text: Si el detector falla, usa «Confirmo que estoy en el lugar».
  camera_count_lab:
    id: camera_count_lab
    type: camera
    label: Conteo con cámara
    cardImage: /media/pilot-basement.jpg
    cameraMode: count
    cameraCountCategory: chair
    allowCameraManualConfirm: true
    cameraPrompt: Fotografía varias sillas si puedes; el conteo es orientativo.
    prompt: En demo escribe 2 como respuesta.
    answer: "2"
    normalize: trim
    maxHints: 1
    hints:
      - level: 1
        text: Dos sillas bastan en la demo.
  sigil_lock:
    id: sigil_lock
    type: code
    label: Panel SENSOR
    cardImage: /media/pilot-entrance.jpg
    prompt: La palabra en el suelo del pasillo de ópticas (siete letras, mayúsculas).
    answer: SENSOR
    normalize: uppercase
    maxHints: 1
    hints:
      - level: 1
        text: Es la abreviatura de «sensorial» en el letrero del pasillo.
  voice_finale:
    id: voice_finale
    type: voice
    label: Sello de voz
    cardImage: /media/pilot-cover.jpg
    prompt: Di en voz alta la frase mágica para cerrar el laboratorio.
    answer: "luego"
    normalize: lowercase
    voiceMatchMode: fuzzy
    allowTextFallback: true
    voiceOffline: true
    voiceLocale: es-ES
    maxHints: 1
    hints:
      - level: 1
        text: La frase es «luego» (como «hasta luego» sin el hasta).