id: pilot
name: La oficina del conserje
tagline: Un edificio dormido, un candado que guarda secretos de otro siglo.
theme: urban
coverImage: /media/pilot-cover.jpg
timeLimitSec: 3600
startSceneId: entrance
items:
  fuse:
    name: Fusible
    description: Pequeño, metálico, aún caliente al tacto.
    image: /media/pilot-control.jpg
winCondition:
  type: puzzle_solved
  puzzleId: panel_final
beats:
  - id: pilot_open
    after: session_started
    text: "La humedad del post-it insiste: algo escrito en otro siglo abre el camino al sótano."
  - id: pilot_lock
    after: puzzle_solved
    puzzleId: lockbox
    text: "La puerta del conserje cede; el ascensor sigue muerto, pero el sótano zumba."
  - id: pilot_basement
    after: scene_entered
    sceneId: basement
    text: "Falta el fusible: sin él el edificio entero permanecerá a oscuras."
scenes:
  entrance:
    id: entrance
    title: Entrada del edificio
    image: /media/pilot-entrance.jpg
    mood: Luces de neón en el pasillo, olor a café rancio y cable viejo.
    description: >
      El ascensor lleva horas averiado. La puerta del conserje luce un candado
      numérico recién pasado a moderno; junto a ella, un post-it con tinta
      borrada por la humedad insiste en recordar algo importante.
    puzzles: [lockbox]
    characters: [night_concierge]
    exits:
      - toSceneId: basement
        label: Bajar al sótano
        when:
          type: puzzle_solved
          puzzleId: lockbox
  basement:
    id: basement
    title: Sótano
    image: /media/pilot-basement.jpg
    mood: Vibración eléctrica en el suelo; linternas del móvil parpadean solas.
    description: >
      Tuberías sudan condensación. El cuadro de fusibles está abierto y falta
      el último módulo: sin él, el edificio seguirá a oscuras.
    items: [fuse]
    puzzles: [fuse_slot]
    exits:
      - toSceneId: control
        label: Ir a la sala de control
        when:
          type: puzzle_solved
          puzzleId: fuse_slot
  control:
    id: control
    title: Sala de control
    image: /media/pilot-control.jpg
    mood: Pantallas retro iluminan monitores apagados; el silencio pesa.
    description: >
      El pulsador maestro vuelve a la vida. Aún queda un panel antiguo que
      pide un código de cuatro letras antes de devolver la luz al bloque entero.
    puzzles: [panel_final]
    exits: []
characters:
  night_concierge:
    id: night_concierge
    displayName: Conserje nocturno
    voiceTone: Irónico, cansado; evita cifras concretas.
    backstoryPublic: Lleva décadas en la entrada y conoce cada rumor del edificio.
    greeting: "¿Otra vez despierto a estas horas? Pregunta lo que quieras, no prometo milagros."
    spokenReplies: true
    voiceLocale: es-ES
    authorizedKnowledge:
      - La humedad del pasillo borró casi todo el post-it del candado.
      - El candado es digital y nuevo; el viejo mecánico ya no funciona.
      - El post-it insiste en un año que suena a novela distópica.
    forbiddenTopics:
      - código exacto del candado
      - dígitos
    fallbackLines:
      - Mirad el post-it; yo no guardo cifras en la cabeza.
      - El ascensor lleva muerto todo el día, no me preguntes por eso.
puzzles:
  lockbox:
    id: lockbox
    type: code
    label: Candado del conserje
    prompt: Introduce el código del candado (4 dígitos).
    answer: "1984"
    onSolve:
      grantClue:
        id: postit_distopia
        text: "El post-it mencionaba un año distópico muy citado; el candado del sótano reconoce ese hilo."
    maxHints: 3
    hints:
      - level: 1
        text: El post-it menciona un año distópico muy citado en libros.
      - level: 2
        text: El año tiene cuatro dígitos y empieza por 19.
      - level: 3
        text: Prueba 1984.
  fuse_slot:
    id: fuse_slot
    type: inventory
    label: Cuadro de fusibles
    prompt: Coloca el fusible en la ranura vacía.
    requiresItem: fuse
    maxHints: 2
    hints:
      - level: 1
        text: Necesitas algo metálico que encaje en la ranura.
      - level: 2
        text: Toma el fusible del sótano y úsalo aquí (acción usar objeto).
  panel_final:
    id: panel_final
    type: code
    label: Panel maestro
    prompt: Código del panel (4 letras, mayúsculas).
    answer: LUZ
    normalize: uppercase
    maxHints: 3
    hints:
      - level: 1
        text: Cuando el cuadro funciona, lo primero que vuelve es la iluminación.
      - level: 2
        text: La palabra es corta y en español, cuatro letras.
      - level: 3
        text: La solución es LUZ.
