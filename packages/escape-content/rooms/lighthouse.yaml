id: lighthouse
name: El faro de Punta Norte
tagline: Marea alta, aceite escaso y un faro que debe volver a hablar con el mar.
theme: coastal
coverImage: /media/lighthouse-cover.jpg
timeLimitSec: 2700
startSceneId: dock
items:
  oil_can:
    name: Bidón de aceite
    description: Ligeramente oxidado; el tapón gotea un hilo dorado.
    image: /media/lighthouse-supply.jpg
winCondition:
  type: puzzle_solved
  puzzleId: beacon_sequence
scenes:
  dock:
    id: dock
    title: Muelle
    image: /media/lighthouse-dock.jpg
    mood: Viento horizontal, cuerdas que crujen, faro cortado por la espuma.
    description: >
      Las olas golpean los pilotes como tambores. En el poste de marea una placa
      oxidadíssima advierte: «Solo con la marea alta se abre el almacén».
      La aguja trepa al tramo marcado en inglés en el borde superior de la escala.
    puzzles: [tide_lock]
    exits:
      - toSceneId: supply
        label: Entrar al almacén
        when:
          type: puzzle_solved
          puzzleId: tide_lock
  supply:
    id: supply
    title: Almacén del faro
    image: /media/lighthouse-supply.jpg
    mood: Salitre en el aire, sacos mojados, un bidón que aún pesa.
    description: >
      Cajas con herrajes viejos y una linterna auxiliar con el cristal opaco.
      Sin combustible no podrás subir a ajustar el mecanismo superior.
    items: [oil_can]
    puzzles: [refill_lamp]
    exits:
      - toSceneId: lantern_room
        label: Subir a la linterna
        when:
          type: puzzle_solved
          puzzleId: refill_lamp
  lantern_room:
    id: lantern_room
    title: Sala de la linterna
    image: /media/lighthouse-lantern.svg
    mood: El haz gira débil; el mar exige una señal clara esta noche.
    description: >
      El prisma late con un ritmo errático. Sobre la barandilla, una nota del
      guardián: «Tres letras, el patrón clásico de socorro».
    puzzles: [beacon_sequence]
    exits: []
puzzles:
  tide_lock:
    id: tide_lock
    type: code
    label: Cerradura del almacén
    prompt: Código del almacén (marea en inglés, 4 letras).
    answer: HIGH
    normalize: uppercase
    maxHints: 3
    hints:
      - level: 1
        text: La placa del muelle ya te dio la palabra; está en inglés.
      - level: 2
        text: Cuatro letras, todo mayúsculas.
      - level: 3
        text: HIGH.
  refill_lamp:
    id: refill_lamp
    type: inventory
    label: Linterna auxiliar
    prompt: Reposta la linterna con el bidón.
    requiresItem: oil_can
    maxHints: 2
    hints:
      - level: 1
        text: Necesitas el líquido del almacén.
      - level: 2
        text: Usa el bidón de aceite en este puzzle.
  beacon_sequence:
    id: beacon_sequence
    type: code
    label: Señal del faro
    prompt: Patrón de socorro en morse (3 letras).
    answer: SOS
    normalize: uppercase
    maxHints: 3
    hints:
      - level: 1
        text: Tres cortos, tres largos, tres cortos… en letras se abrevia así.
      - level: 2
        text: Tres letras muy conocidas en emergencias marítimas.
      - level: 3
        text: SOS.
